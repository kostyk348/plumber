name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# The release job attaches archives to the GitHub release, which needs a writable token.
permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: tests (library, rules, openers and the real daemon binary)
        run: cargo test --all-targets

  build:
    # Binaries for every desktop platform on a tag, attached to the release.
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          out="plumber-${{ matrix.suffix }}"
          mkdir -p "$out"
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          for bin in plumberd plumb plumber-open; do
            cp "target/${{ matrix.target }}/release/${bin}${ext}" "$out/"
          done
          cp README.md plumbing.example "$out/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${out}.zip" "$out" > /dev/null
            echo "ARCHIVE=${out}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${out}.tar.gz" "$out"
            echo "ARCHIVE=${out}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: checksum
        shell: bash
        run: sha256sum "$ARCHIVE" > "$ARCHIVE.sha256" || shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
