[package]
name = "plumber"
version = "0.4.0"
edition = "2021"
description = "Plan 9's plumber, rebuilt: message routing between programs by rules, not by integrations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kostyk348/plumber"
rust-version = "1.80"

[lib]
name = "plumber"
path = "src/lib.rs"

[[bin]]
name = "plumberd"
path = "src/bin/plumberd.rs"

[[bin]]
name = "plumb"
path = "src/bin/plumb.rs"

[[bin]]
name = "plumber-open"
path = "src/bin/plumber_open.rs"

# The console is optional: `cargo build --features gui`. The core stays dependency-free, and a
# headless machine or a CI runner never pays for a windowing stack it cannot use.
[[bin]]
name = "plumber-console"
path = "src/bin/console.rs"
required-features = ["gui"]

[dependencies]
# A rules file speaks regular expressions; the crate is the standard, safe one.
regex = "1"

# Only for the console (feature `gui`). Glow (OpenGL) rather than wgpu: the wgpu backend pulls a
# Vulkan/Metal/DX12 stack that triples the build and needs a GPU driver for a status window.
eframe = { version = "0.29", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[features]
default = []
gui = ["dep:eframe"]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
